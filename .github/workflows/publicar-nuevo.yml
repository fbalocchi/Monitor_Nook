name: Publicar Panel NOOK limpio 1.1.3

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/publicar-nuevo.yml, NOOK-PANEL-LIMPIO-1.1.3.zip]

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Extraer la copia publica verificada
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, zipfile
          archive = Path('NOOK-PANEL-LIMPIO-1.1.3.zip')
          expected = 'fc96fd4ef2e99727a4032f2506769e2a1adc9b26e098e118c415712aa20ccdd4'
          if not archive.exists():
              print('No hay un paquete nuevo para aplicar.')
              raise SystemExit(0)
          if hashlib.sha256(archive.read_bytes()).hexdigest() != expected:
              raise SystemExit('El ZIP no coincide con la copia publica revisada.')
          added = 0
          with zipfile.ZipFile(archive) as package:
              for entry in package.infolist():
                  if entry.is_dir():
                      continue
                  parts = PurePosixPath(entry.filename).parts
                  if len(parts) < 2 or parts[0] != 'nook-panel' or '..' in parts:
                      raise SystemExit('Ruta inesperada en el ZIP.')
                  target = Path(*parts[1:])
                  data = package.read(entry)
                  if target.exists() and target.read_bytes() == data:
                      continue
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)
                  added += 1
          print('Archivos incorporados:', added)
          archive.unlink()
          print('Copia limpia 1.1.3 publicada y ZIP de entrada retirado.')
          PY
      - name: Guardar archivos en main
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add --all
          if git diff --cached --quiet; then
            echo 'Todos los archivos ya estaban publicados.'
            exit 0
          fi
          git commit -m 'Publicar Panel NOOK 1.1.3 con ubicacion de ejemplo'
          git push origin HEAD:main
